<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">

    <!-- Fresh and Vibrant Styles -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #7cc945, #5ed627); /* Soft pink-to-purple gradient */
            color: #333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            margin: 0;
        }

        .register-page {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .form-container {
            background: #71b84b;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px 50px;
            width: 100%;
            max-width: 450px;
            animation: fadeIn 1s ease-in-out;
            margin-left: 30px; /* Create some space from the logo */
        }

        .form-container h2 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #FF66B2; /* Vibrant pink for the heading */
            text-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .form-container .form-control {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #FF66B2;
            color: #333;
            font-size: 1rem;
        }

        .form-container .form-control::placeholder {
            color: #aaa;
        }

        .btn-primary {
            background-color: #FF66B2;
            border: none;
            padding: 15px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            border-radius: 50px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            background-color: #FF3385;
            transform: translateY(-5px);
            box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.3);
        }

        .text-primary {
            color: #FF66B2;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .text-primary:hover {
            color: #FF3385;
        }

        .card-container p {
            color: #333;
            font-size: 1rem;
        }

        /* Animations */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(-50px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Left Side Image */
        .image-container {
            width: 50%;
            max-width: 500px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #7eca28; /* Light pink for the background */
            border-radius: 20px;
        }

        .image-container img {
            max-width: 80%;
            height: auto;
            border-radius: 15px;
        }

        /* Flexbox Layout */
        .register-page {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            padding: 0 20px;
        }

        @media (max-width: 768px) {
            .register-page {
                flex-direction: column;
            }

            .image-container {
                width: 100%;
                height: 300px;
                margin-bottom: 20px;
            }

            .form-container {
                width: 100%;
                margin-left: 0;
            }
        }
    </style>
</head>

<body class="register-page">
    <div class="register-page">
        <!-- Left Side Image -->
        <div class="image-container">
            <img src="/static/images/logo.png" alt="Logo">
        </div>

        <!-- Registration Form -->
        <div class="form-container">
            <h2>Register</h2>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="alert-messages">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="/register" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label for="organization" class="form-label">Organization</label>
                    <input type="text" class="form-control" id="organization" name="organization" placeholder="Enter your organization name" required>
                </div>
                <div class="mb-3">
                    <label for="company_email" class="form-label">Company Email</label>
                    <input type="email" class="form-control" id="company_email" name="company_email" placeholder="Enter your company email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Register</button>
                </div>
                <p class="text-center mt-3">
                    Already have an account? <a href="/login" class="text-primary">Login</a>
                </p>
            </form>
        </div>
    </div>
</body>

</html>
