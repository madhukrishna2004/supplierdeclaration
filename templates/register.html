<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | TradeSphere Global</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="/static/css/styles.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #7cc945, #5ed627);
      color: #333;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      margin: 0;
    }

    .register-wrapper {
      width: 100%;
      max-width: 950px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      padding: 20px;
    }

    .image-section {
      width: 50%;
      background-color: #7eca28;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .image-section img {
      max-width: 80%;
      border-radius: 15px;
    }

    .form-section {
      background: #71b84b;
      border-radius: 20px;
      box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
      padding: 40px 50px;
      width: 100%;
      max-width: 450px;
      animation: fadeIn 0.8s ease-in-out;
    }

    .form-section h2 {
      font-size: 2rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 30px;
      letter-spacing: 1px;
      color: #FF66B2;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
    }

    .form-control {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      border: 2px solid #FF66B2;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .form-control::placeholder {
      color: #999;
    }

    .btn-primary {
      background-color: #FF66B2;
      border: none;
      padding: 15px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      text-transform: uppercase;
      transition: all 0.4s ease;
    }

    .btn-primary:hover {
      background-color: #FF3385;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .text-primary {
      color: #FF66B2 !important;
    }

    .text-primary:hover {
      color: #FF3385 !important;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: translateY(-20px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      .register-wrapper {
        flex-direction: column;
      }

      .image-section {
        width: 100%;
        height: 250px;
        margin-bottom: 20px;
      }

      .form-section {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="register-wrapper">
    <!-- Left Image -->
    <div class="image-section">
      <img src="/static/images/logo.png" alt="TradeSphere Global Logo">
    </div>

    <!-- Form Section -->
    <div class="form-section">
      <h2>Register</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="/register" method="POST">
        <div class="mb-3">
          <label for="username" class="form-label">Username or Email</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="Enter a username or email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Register</button>
        </div>
        <p class="text-center mt-3">
          Already have an account? <a href="/login" class="text-primary">Login</a>
        </p>
      </form>
    </div>
  </div>
</body>

</html>
