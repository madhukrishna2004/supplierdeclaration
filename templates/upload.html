<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Document | TradeSphere Global</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f8;
            padding: 3rem;
            margin: 0;
        }
        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2a4d69;
            margin-bottom: 1rem;
            text-align: center;
        }
        form {
            margin-top: 2rem;
        }
        input[type="file"] {
            display: block;
            margin: 1rem 0;
        }
        button {
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            border: none;
            color: white;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background: linear-gradient(to right, #4f9da6, #7db9e8);
        }
        a {
            float: right;
            text-decoration: none;
            font-size: 0.9rem;
            color: #4f9da6;
        }
        .flash {
            text-align: center;
            color: green;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome, {{ username }}</h2>
        <a href="/logout">Logout</a>
        <form method="POST" enctype="multipart/form-data">
            <label>Select file to upload:</label>
            <input type="file" name="file" required>
            <button type="submit">Upload</button>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="flash">{{ message }}</p>
        {% endfor %}
        {% endwith %}
    </div>
</body>
</html>
